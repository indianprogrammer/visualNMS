<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web-NMS</title>
  <script>(function(){try{var t=localStorage.getItem('webnms_theme')||'dark';document.documentElement.setAttribute('data-theme',t);document.documentElement.setAttribute('data-bs-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler-vendors.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/css/app.css?v=20260912t">
</head>
<body>
  <div id="login-root"></div>

  <div class="page" id="app-root" style="display:none">
    <aside class="navbar navbar-vertical navbar-expand-lg">
      <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar-menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <h1 class="navbar-brand navbar-brand-autodark d-none-navbar-horizontal pe-0 pe-md-3">
          <span style="font-size:1.1rem;color:#2fb344;font-weight:700">Web-NMS</span>
        </h1>
        <div class="collapse navbar-collapse" id="sidebar-menu">
          <ul class="navbar-nav pt-lg-3" id="nav-menu">
            <li class="nav-item"><a class="nav-link active" href="#" data-page="dashboard"><i class="nav-icon ti ti-dashboard"></i><span class="nav-link-title">Dashboard</span></a></li>
            <li class="nav-item"><a class="nav-link" href="#" data-page="topology"><i class="nav-icon ti ti-network"></i><span class="nav-link-title">Topology</span></a></li>
            <li class="nav-item"><a class="nav-link" href="#" data-page="devices"><i class="nav-icon ti ti-server"></i><span class="nav-link-title">Devices</span></a></li>
            <li class="nav-item"><a class="nav-link" href="#" data-page="alerts"><i class="nav-icon ti ti-alert-triangle"></i><span class="nav-link-title">Alerts</span></a></li>
            <li class="nav-item"><a class="nav-link" href="#" data-page="discovery"><i class="nav-icon ti ti-scan"></i><span class="nav-link-title">Discovery</span></a></li>
            <li class="nav-item"><a class="nav-link" href="#" data-page="tools"><i class="nav-icon ti ti-tool"></i><span class="nav-link-title">Tools</span></a></li>
            <li class="nav-item"><a class="nav-link" href="#" data-page="logs"><i class="nav-icon ti ti-list"></i><span class="nav-link-title">Event Log</span></a></li>
            <li class="nav-item"><a class="nav-link" href="#" data-page="settings"><i class="nav-icon ti ti-settings"></i><span class="nav-link-title">Settings</span></a></li>
          </ul>
          <div class="mt-auto pb-3 px-3 d-flex flex-column gap-2"><div class="dropup"><button class="btn btn-ghost btn-sm w-100 dropdown-toggle" data-bs-toggle="dropdown"><i class="ti ti-palette me-1"></i><span class="theme-name">Theme</span></button><div class="dropdown-menu"><button class="dropdown-item" onclick="setTheme('dark')">Cyber Dark</button><button class="dropdown-item" onclick="setTheme('light')">Arctic Light</button><button class="dropdown-item" onclick="setTheme('midnight')">Midnight Violet</button><button class="dropdown-item" onclick="setTheme('matrix')">Matrix Green</button><button class="dropdown-item" onclick="setTheme('ember')">Ember Orange</button></div></div><button class="btn btn-ghost btn-sm w-100" id="btn-logout"><i class="ti ti-logout me-1"></i>Logout</button></div>
        </div>
      </div>
    </aside>
    <div class="page-wrapper">
      <div class="page-header d-print-none"><div class="container-xl"><div class="d-flex justify-content-between align-items-center"><div><div class="page-pretitle">Web-NMS</div><h2 class="page-title" id="page-title">Dashboard</h2></div><div class="dropdown"><button class="btn btn-ghost btn-sm dropdown-toggle" data-bs-toggle="dropdown" title="Choose theme"><i class="ti ti-palette me-1"></i><span class="theme-name">Theme</span></button><div class="dropdown-menu dropdown-menu-end"><button class="dropdown-item" onclick="setTheme('dark')">Cyber Dark</button><button class="dropdown-item" onclick="setTheme('light')">Arctic Light</button><button class="dropdown-item" onclick="setTheme('midnight')">Midnight Violet</button><button class="dropdown-item" onclick="setTheme('matrix')">Matrix Green</button><button class="dropdown-item" onclick="setTheme('ember')">Ember Orange</button></div></div></div></div></div>
      <div class="page-body"><div class="container-xl" id="page-content-container"><div id="page-content"></div></div></div>
      <footer class="footer footer-transparent d-print-none"><div class="container-xl"><div class="row text-center align-items-center flex-row-reverse"><div class="col-lg-auto ms-lg-auto"><ul class="list-inline list-inline-dots mb-0"><li class="list-inline-item"><span class="link-secondary">Web-NMS v1.0</span></li></ul></div></div></div></footer>
    </div>
  </div>

  <div class="modal modal-blur fade" id="modal-device" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title" id="dev-modal-title">Add Device</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <input type="hidden" id="df-id">
      <div class="row mb-3"><div class="col-md-6"><label class="form-label">Name</label><input type="text" class="form-control" id="df-name"></div><div class="col-md-6"><label class="form-label">IP Address</label><input type="text" class="form-control" id="df-ip"></div></div>
      <div class="row mb-3"><div class="col-md-4"><label class="form-label">Type</label><select class="form-select" id="df-type"><option value="generic">Generic</option><option value="router">Router</option><option value="switch">Switch</option><option value="server">Server</option><option value="wireless_ap">Wireless AP</option><option value="firewall">Firewall</option><option value="printer">Printer</option><option value="ont">ONT</option></select></div><div class="col-md-8"><label class="form-label">SNMP Profile</label><select class="form-select" id="df-profile"><option value="">— Manual —</option></select></div></div>
      <div id="df-manual-rows"><div class="row mb-3"><div class="col-md-4"><label class="form-label">SNMP Port</label><input type="number" class="form-control" id="df-port" value="161"></div>
      <div class="col-md-4"><label class="form-label">SNMP Version</label><select class="form-select" id="df-ver"><option value="2c">v2c</option><option value="1">v1</option><option value="3">v3</option></select></div>
      <div class="col-md-4"><label class="form-label">SNMP Community</label><input type="text" class="form-control" id="df-comm" value="public"></div></div></div>
      <div id="df-v3-rows" style="display:none">
        <div class="row mb-3"><div class="col-md-4"><label class="form-label">SNMP User</label><input type="text" class="form-control" id="df-user" autocomplete="off"></div><div class="col-md-4"><label class="form-label">Auth Protocol</label><select class="form-select" id="df-authp"><option value="none">None</option><option value="md5">MD5</option><option value="sha">SHA</option></select></div><div class="col-md-4"><label class="form-label">Auth Password</label><input type="password" class="form-control" id="df-authpw" autocomplete="off"></div></div>
        <div class="row mb-3"><div class="col-md-6"><label class="form-label">Privacy Protocol</label><select class="form-select" id="df-privp"><option value="none">None</option><option value="des">DES</option><option value="aes">AES</option></select></div><div class="col-md-6"><label class="form-label">Privacy Password</label><input type="password" class="form-control" id="df-privpw" autocomplete="off"></div></div>
      </div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="btn-save-dev">Save</button></div>
  </div></div></div>

  <div class="modal modal-blur fade" id="modal-map" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">New Map</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><label class="form-label">Title</label><input type="text" class="form-control" id="mf-title"></div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="btn-save-map">Create</button></div>
  </div></div></div>

  <div class="modal modal-blur fade" id="modal-snmp" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title" id="snmp-modal-title">Add SNMP Profile</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <input type="hidden" id="sp-id">
      <div class="mb-3"><label class="form-label">Profile Name</label><input type="text" class="form-control" id="sp-name" placeholder="e.g. Core switches" autocomplete="off"></div>
      <div class="row mb-3"><div class="col-md-6"><label class="form-label">SNMP Version</label><select class="form-select" id="sp-ver" onchange="snmpVerToggle()"><option value="2c">v2c</option><option value="1">v1</option><option value="3">v3</option></select></div><div class="col-md-6"><label class="form-label">Port</label><input type="number" class="form-control" id="sp-port" value="161"></div></div>
      <div class="mb-3" id="sp-comm-row"><label class="form-label">Community</label><input type="text" class="form-control" id="sp-comm" value="public" autocomplete="off"></div>
      <div id="sp-v3-rows" style="display:none">
        <div class="mb-3"><label class="form-label">Username</label><input type="text" class="form-control" id="sp-user" autocomplete="off"></div>
        <div class="row mb-3"><div class="col-md-6"><label class="form-label">Auth Protocol</label><select class="form-select" id="sp-authp"><option value="none">None</option><option value="md5">MD5</option><option value="sha">SHA</option></select></div><div class="col-md-6"><label class="form-label">Auth Password</label><input type="password" class="form-control" id="sp-authpw" autocomplete="off"></div></div>
        <div class="row mb-3"><div class="col-md-6"><label class="form-label">Privacy Protocol</label><select class="form-select" id="sp-privp"><option value="none">None</option><option value="des">DES</option><option value="aes">AES</option></select></div><div class="col-md-6"><label class="form-label">Privacy Password</label><input type="password" class="form-control" id="sp-privpw" autocomplete="off"></div></div>
      </div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="btn-save-snmp">Save</button></div>
  </div></div></div>

  <div class="modal modal-blur fade" id="modal-ping" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title" id="ping-modal-title">PING</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <div class="d-flex gap-3 mb-2 small text-muted"><span>Sent: <b id="ping-sent">0</b></span><span>OK: <b class="text-success" id="ping-ok">0</b></span><span>Fail: <b class="text-danger" id="ping-fail">0</b></span><span>Loss: <b class="text-warning" id="ping-loss">0%</b></span><span>Avg: <b id="ping-avg">-</b></span></div>
      <div class="progress mb-2" style="height:10px"><div id="ping-bar-ok" class="progress-bar bg-success" style="width:0%"></div><div id="ping-bar-fail" class="progress-bar bg-danger" style="width:0%"></div></div>
      <div class="mb-2" style="height:150px"><canvas id="ping-chart"></canvas></div>
      <pre class="tool-output" id="ping-out" style="max-height:220px;overflow-y:auto;margin:0"></pre>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" id="btn-ping-toggle">Stop</button><button class="btn btn-secondary" data-bs-dismiss="modal">Close</button></div>
  </div></div></div>

  <div class="modal modal-blur fade" id="modal-tool" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title" id="tool-modal-title">Tool</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><pre class="tool-output" id="tool-out" style="max-height:450px;overflow-y:auto;margin:0">Running...</pre></div>
    <div class="modal-footer"><button class="btn btn-secondary" id="btn-tool-stop" style="display:none">Stop</button><button class="btn btn-secondary" data-bs-dismiss="modal">Close</button></div>
  </div></div></div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-box"></div>

  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/js/tabler.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape-grid-guide@2.3.3/cytoscape-grid-guide.js"></script>
  <script src="/js/app.js?v=20260913n"></script>
</body>
</html>
